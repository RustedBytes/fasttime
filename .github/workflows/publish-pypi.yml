name: Publish Python distributions

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check package versions and release tag
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as file:
              python_version = tomllib.load(file)["project"]["version"]

          with open("Cargo.toml", "rb") as file:
              rust_version = tomllib.load(file)["package"]["version"]

          if python_version != rust_version:
              raise SystemExit(
                  f"Version mismatch: pyproject.toml={python_version}, Cargo.toml={rust_version}"
              )

          if os.environ["GITHUB_EVENT_NAME"] == "push":
              expected_tag = f"v{python_version}"
              actual_tag = os.environ["GITHUB_REF_NAME"]
              if actual_tag != expected_tag:
                  raise SystemExit(
                      f"Release tag {actual_tag!r} does not match {expected_tag!r}"
                  )
          PY

  manylinux:
    name: manylinux ${{ matrix.target }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: "2_17"
          args: >-
            --release --locked --compatibility pypi --find-interpreter --out dist

      - name: Test wheel
        if: matrix.target == 'x86_64'
        run: |
          python -m pip install pytest
          python -m pip install --no-index --no-deps --force-reinstall --find-links dist fasttime-rs
          python -m pytest python/tests

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: python-dist-manylinux-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  musllinux:
    name: musllinux ${{ matrix.target }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: musllinux_1_2
          args: >-
            --release --locked --compatibility pypi --find-interpreter --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: python-dist-musllinux-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows CPython ${{ matrix.python-version }}
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.14.1
          target: x64
          args: >-
            --release --locked --compatibility pypi --interpreter python --out dist

      - name: Test wheel
        run: |
          python -m pip install pytest
          python -m pip install --no-index --no-deps --force-reinstall --find-links dist fasttime-rs
          python -m pytest python/tests

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: python-dist-windows-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.platform.target }} CPython ${{ matrix.python-version }}
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.14.1
          target: ${{ matrix.platform.target }}
          args: >-
            --release --locked --compatibility pypi --interpreter python --out dist

      - name: Test wheel
        run: |
          python -m pip install pytest
          python -m pip install --no-index --no-deps --force-reinstall --find-links dist fasttime-rs
          python -m pytest python/tests

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: python-dist-macos-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          maturin-version: v1.14.1
          args: --out dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v6
        with:
          name: python-dist-sdist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [manylinux, musllinux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fasttime-rs/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
