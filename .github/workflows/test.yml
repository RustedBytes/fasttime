name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  python-quality:
    name: Ruff and Pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install Python quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: Lint Python
        run: ruff check python
      - name: Check Python formatting
        run: ruff format --check python
      - name: Check Python types
        run: pyright

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Run tests (no default features)
        run: cargo test --no-default-features

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python build and test tools
        run: python -m pip install maturin pytest

      - name: Build Python wheel
        run: maturin build --interpreter python

      - name: Install Python wheel
        run: python -m pip install --force-reinstall target/wheels/*.whl

      - name: Run Python tests
        run: python -m pytest python/tests

      - name: Run Python examples
        run: |
          for example in python/examples/*.py; do
            python "$example" > /dev/null
          done
